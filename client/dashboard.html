<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdaptNet – Command Dashboard</title>
<link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css">
<style>
#login{max-width:340px;margin:12vh auto;display:grid;gap:10px}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#0d2a4a;color:#fff}
header h1{font-size:18px;margin:0 auto 0 0}header select{width:auto}
.stat{background:#ffffff26;padding:4px 12px;border-radius:99px;font-size:14px}
#dot{width:10px;height:10px;border-radius:50%;background:#e53935}#dot.on{background:#43a047}
main{display:grid;grid-template-columns:400px 1fr;gap:12px;padding:12px;height:calc(100vh - 56px)}
#list{overflow:auto;display:grid;gap:8px;align-content:start}
.item{cursor:pointer;border-left:6px solid #ccc}.item.sel{outline:2px solid #1565c0}.item.done{opacity:.55}
#right{display:grid;grid-template-rows:45% 1fr;gap:12px;min-height:0}
#map{border-radius:14px;background:#dfe7ee;z-index:0}#detail{overflow:auto}
@media(max-width:800px){main{grid-template-columns:1fr;height:auto}#map{height:300px}#list{max-height:50vh}#right{display:block}#detail{margin-top:12px}}
</style></head><body>

<form id="login" class="card">
  <h2 style="margin:0">AdaptNet Dashboard</h2>
  <input id="u" value="admin" autocomplete="username" placeholder="Username">
  <input id="p" type="password" autocomplete="current-password" placeholder="Password">
  <button>Log in</button><div id="err" class="muted" style="color:#c62828"></div>
</form>

<div id="app" hidden>
  <header>
    <h1>AdaptNet Dashboard</h1><div id="stats" class="row"></div><span id="dot" title="Live connection"></span>
    <select id="filter"><option value="open">Open</option><option value="">All</option><option value="new">New</option><option value="seen">Seen</option><option value="on_the_way">On the way</option><option value="done">Done</option></select>
    <button class="sec" id="out">Log out</button>
  </header>
  <main>
    <div id="list"></div>
    <div id="right"><div id="map"></div><div id="detail" class="card"><p class="muted">Select a request to see details and reply.</p></div></div>
  </main>
</div>

<script src="vendor/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL={critical:'#d32f2f',high:'#ef6c00',medium:'#f9a825',low:'#388e3c'};
const QUICK=[['On the way','Help is on the way. Stay where you are and stay safe.'],['Go to camp','Please move to the nearest relief camp if it is safe.'],['More info','Please send more details: how many people and an exact landmark.']];
let token=sessionStorage.getItem('t'),data=new Map(),sel=null,map,layer,socket;

const ago=t=>{const m=Math.max(0,(Date.now()-new Date(t))/6e4|0);return m<1?'just now':m<60?m+' min ago':m<1440?(m/60|0)+' h ago':(m/1440|0)+' d ago'};
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},250)}catch{}};

async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});
  if(r.status===401){sessionStorage.removeItem('t');location.reload();throw new Error('Session expired')}
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d;
}

$('#login').onsubmit=async e=>{
  e.preventDefault();$('#err').textContent='';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');
    token=d.token;sessionStorage.setItem('t',token);start();
  }catch(err){$('#err').textContent=err.message}
};
$('#out').onclick=()=>{sessionStorage.removeItem('t');location.reload()};
$('#filter').onchange=()=>render();
$('#list').onclick=e=>{const c=e.target.closest('.item');if(c)pick(c.dataset.id)};

async function start(){
  $('#login').hidden=true;$('#app').hidden=false;
  map=L.map('map').setView([22,79],5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  setTimeout(()=>map.invalidateSize(),150);
  try{(await api('/api/requests?limit=500')).forEach(r=>data.set(r.id,r))}catch{return}
  render(true);
  if(typeof io==='function'){
    socket=io({auth:{token}});
    socket.on('connect',()=>$('#dot').className='on');
    socket.on('disconnect',()=>$('#dot').className='');
    socket.on('request:new',r=>{data.set(r.id,r);render();if(r.priority_label==='critical'||r.priority_label==='high')beep()});
    socket.on('request:updated',r=>{data.set(r.id,{...data.get(r.id),...r});render();if(sel===r.id)detail(r.id)});
  }
  setInterval(()=>render(),30000);
}

function render(fit){
  const f=$('#filter').value;
  const all=[...data.values()];
  const rows=all.filter(r=>!f||(f==='open'?r.status!=='done':r.status===f))
    .sort((a,b)=>(a.status==='done')-(b.status==='done')||b.priority_score-a.priority_score||a.created_at.localeCompare(b.created_at));
  $('#stats').innerHTML=`<span class="stat">Open ${all.filter(r=>r.status!=='done').length}</span><span class="stat">Critical ${all.filter(r=>r.status!=='done'&&r.priority_label==='critical').length}</span><span class="stat">Done ${all.filter(r=>r.status==='done').length}</span>`;
  $('#list').innerHTML=rows.map(r=>`<div class="card item ${r.status==='done'?'done':''} ${sel===r.id?'sel':''}" data-id="${r.id}" style="border-left-color:${COL[r.priority_label]}">
    <div class="row"><span class="badge ${r.priority_label}">${r.priority_label}</span><b>${esc(r.type)}</b><span class="muted" style="margin-left:auto">${ago(r.created_at)}</span></div>
    <div>${esc((r.message||'(no message)').slice(0,110))}</div>
    <div class="muted">${r.people_count} people · ${esc(r.status.replace('_',' '))} · ${esc(r.tracking_code)}</div></div>`).join('')||'<p class="muted">No requests.</p>';
  layer.clearLayers();const pts=[];
  rows.forEach(r=>{
    if(r.latitude==null||r.longitude==null)return;
    L.circleMarker([r.latitude,r.longitude],{radius:r.id===sel?13:9,color:'#fff',weight:2,fillColor:COL[r.priority_label],fillOpacity:r.status==='done'?.35:.95})
      .on('click',()=>pick(r.id)).addTo(layer);
    pts.push([r.latitude,r.longitude]);
  });
  if(fit&&pts.length)map.fitBounds(pts,{padding:[40,40],maxZoom:14});
}

function pick(id){
  sel=id;render();detail(id);
  const r=data.get(id);if(r&&r.latitude!=null)map.setView([r.latitude,r.longitude],Math.max(map.getZoom(),14));
}

async function detail(id){
  let r;try{r=await api('/api/requests/'+id)}catch{return}
  const needs=r.special_needs.map(n=>`<span class="badge" style="background:#546e7a">${esc(n.replace('_',' '))}</span>`).join(' ');
  $('#detail').innerHTML=`
    <div class="row"><span class="badge ${r.priority_label}">${r.priority_label} ${r.priority_score}</span><h3 style="margin:0">${esc(r.type)} · ${esc(r.tracking_code)}</h3></div>
    <p>${esc(r.message)||'<i>No message</i>'}</p>
    <p class="muted">${r.people_count} people · status: <b>${esc(r.status.replace('_',' '))}</b> · received ${ago(r.created_at)}${r.created_at_device?' · written on phone '+ago(r.created_at_device):''}</p>
    <p>${needs}</p>
    ${r.contact_name||r.contact_phone?`<p>Contact: ${esc(r.contact_name)} ${esc(r.contact_phone)}</p>`:''}
    <p class="muted">${r.latitude!=null?`Location: ${r.latitude}, ${r.longitude}`:'No GPS location sent'}</p>
    <div class="row">${['seen','on_the_way','done'].map(s=>`<button class="sec" data-s="${s}" ${r.status===s?'disabled':''}>${s.replace('_',' ')}</button>`).join('')}</div>
    <h4>Messages to victim</h4>
    ${r.replies.map(x=>`<div class="reply">${esc(x.message)}<div class="muted">${ago(x.created_at)}</div></div>`).join('')||'<p class="muted">No replies yet.</p>'}
    <div class="row" style="margin:8px 0">${QUICK.map((q,i)=>`<button class="sec" data-q="${i}">${esc(q[0])}</button>`).join('')}</div>
    <textarea id="msg" rows="2" maxlength="500" placeholder="Type a reply…"></textarea>
    <button id="send" style="margin-top:8px">Send reply</button>`;
  const box=$('#detail');
  box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>api('/api/requests/'+id,{method:'PATCH',body:JSON.stringify({status:b.dataset.s})}).then(()=>detail(id)));
  box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#msg').value=QUICK[b.dataset.q][1]});
  $('#send').onclick=async()=>{const m=$('#msg').value.trim();if(!m)return;await api(`/api/requests/${id}/reply`,{method:'POST',body:JSON.stringify({message:m})});detail(id)};
}

if(token)start();
</script>
</body></html>
