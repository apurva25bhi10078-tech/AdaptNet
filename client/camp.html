<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdaptNet – Camp Manager</title>
<link rel="stylesheet" href="style.css">
<style>
#login{max-width:340px;margin:12vh auto;display:grid;gap:10px}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#1b5e20;color:#fff}
header h1{font-size:18px;margin:0 auto 0 0}header select{width:auto}header a{color:#fff;font-size:14px}
main{display:grid;grid-template-columns:420px 1fr;gap:12px;padding:12px;align-items:start}
.col{display:grid;gap:12px}.f{display:grid;gap:8px}
.beds{font-size:56px;font-weight:800;text-align:center;margin:4px 0}.beds small{font-size:18px;color:#5b6877;font-weight:400}
.big{font-size:28px;padding:10px 22px}
.chips button{margin:0 6px 6px 0;padding:8px 14px;background:#e3e8ee;color:#1b2430}.chips button.on{background:#2e7d32;color:#fff}
.green{background:#2e7d32}
@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body>

<form id="login" class="card">
  <h2 style="margin:0">Camp Manager</h2>
  <input id="u" value="admin" autocomplete="username" placeholder="Username">
  <input id="p" type="password" autocomplete="current-password" placeholder="Password">
  <button class="green">Log in</button><div id="err" class="muted" style="color:#c62828"></div>
</form>

<div id="app" hidden>
  <header>
    <h1>Camp Manager</h1>
    <select id="pick"></select>
    <a href="dashboard.html">Government view</a><a href="/">Victim app</a>
    <button class="sec" id="out">Log out</button>
  </header>
  <main>
    <div class="col">
      <div class="card" id="camp"></div>
      <div class="card">
        <h3 style="margin:0 0 8px">Missing persons</h3>
        <div class="row"><input id="q" placeholder="Search name or place" style="flex:1"><button class="sec" id="sq">Search</button></div>
        <div id="mlist"></div>
        <details style="margin-top:10px"><summary>Report a missing person</summary>
          <div class="f" style="margin-top:8px"><input id="mn" placeholder="Name" maxlength="100"><input id="ma" type="number" min="0" max="120" placeholder="Age (optional)"><input id="mp" placeholder="Last seen place" maxlength="200"><button class="green" id="madd">Add report</button></div>
        </details>
      </div>
    </div>
    <div class="card"><h3 style="margin:0 0 4px">Help requests near this camp</h3><p class="muted" style="margin:0 0 8px">Open requests with a location, nearest first.</p><div id="near" class="f"></div></div>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FAC=['food','water','medical','ambulance','shelter','toilets','power'];
let token=sessionStorage.getItem('t'),camps=[],cur=null,reqs=new Map();

const km=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const ago=t=>{const m=Math.max(0,(Date.now()-new Date(t))/6e4|0);return m<1?'just now':m<60?m+' min ago':(m/60|0)+' h ago'};
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});
  if(r.status===401){sessionStorage.removeItem('t');location.reload();throw new Error('Session expired')}
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d;
}
const J=o=>JSON.stringify(o);

$('#login').onsubmit=async e=>{
  e.preventDefault();$('#err').textContent='';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:J({username:$('#u').value,password:$('#p').value})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');
    token=d.token;sessionStorage.setItem('t',token);start();
  }catch(err){$('#err').textContent=err.message}
};
$('#out').onclick=()=>{sessionStorage.removeItem('t');location.reload()};
$('#pick').onchange=()=>{cur=$('#pick').value;localStorage.setItem('camp',cur);renderCamp();renderNear()};

async function start(){
  $('#login').hidden=true;$('#app').hidden=false;
  camps=await api('/api/camps?limit=100');
  cur=localStorage.getItem('camp')||(camps[0]&&String(camps[0].id))||'new';
  if(cur!=='new'&&!camps.find(c=>String(c.id)===cur))cur=camps[0]?String(camps[0].id):'new';
  renderPick();renderCamp();await loadReqs();loadMissing();
  if(typeof io==='function'){
    const s=io({auth:{token}});
    s.on('request:new',loadReqs);s.on('request:updated',loadReqs);
    s.on('camp:updated',c=>{const i=camps.findIndex(x=>x.id===c.id);i<0?camps.push(c):camps[i]=c;renderPick();if(String(c.id)===cur)renderCamp()});
    s.on('missing:new',loadMissing);
  }
}

function renderPick(){
  $('#pick').innerHTML=camps.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')+'<option value="new">+ Add new camp</option>';
  $('#pick').value=cur;
}

function renderCamp(){
  const box=$('#camp');
  if(cur==='new'){
    box.innerHTML=`<h3 style="margin:0 0 8px">Add a camp</h3><div class="f">
      <input id="nn" placeholder="Camp name" maxlength="150">
      <div class="row"><input id="nlat" placeholder="Latitude" style="flex:1"><input id="nlng" placeholder="Longitude" style="flex:1"></div>
      <button class="sec" id="nloc">Use my current location</button>
      <div class="row"><input id="ncap" type="number" min="0" placeholder="Total beds" style="flex:1"><input id="nbed" type="number" min="0" placeholder="Beds free" style="flex:1"></div>
      <input id="ncon" placeholder="Contact phone" maxlength="100">
      <button class="green" id="nsave">Create camp</button><div id="nerr" class="muted" style="color:#c62828"></div></div>`;
    $('#nloc').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{$('#nlat').value=p.coords.latitude.toFixed(5);$('#nlng').value=p.coords.longitude.toFixed(5)},()=>$('#nerr').textContent='Location blocked. Type the coordinates.'):0;
    $('#nsave').onclick=async()=>{
      try{
        const c=await api('/api/camps',{method:'POST',body:J({name:$('#nn').value.trim(),latitude:+$('#nlat').value,longitude:+$('#nlng').value,capacity:+$('#ncap').value||0,available_beds:+$('#nbed').value||0,contact:$('#ncon').value.trim()||undefined,facilities:[]})});
        camps.push(c);cur=String(c.id);localStorage.setItem('camp',cur);renderPick();renderCamp();renderNear();
      }catch(err){$('#nerr').textContent=err.message}
    };
    return;
  }
  const c=camps.find(x=>String(x.id)===cur);if(!c)return;
  box.innerHTML=`<h3 style="margin:0">${esc(c.name)}</h3><div class="muted">${esc(c.contact||'No contact set')} · updated ${ago(c.updated_at)}</div>
    <div class="beds">${c.available_beds}<small> / ${c.capacity} beds free</small></div>
    <div class="row" style="justify-content:center"><button class="big sec" id="bm">−</button><button class="big green" id="bp">+</button></div>
    <h4 style="margin:14px 0 6px">Facilities available</h4>
    <div class="chips">${FAC.map(f=>`<button data-f="${f}" class="${c.facilities.includes(f)?'on':''}">${f}</button>`).join('')}</div>`;
  const setBeds=async d=>{const v=Math.max(0,Math.min(c.capacity||9999,c.available_beds+d));if(v===c.available_beds)return;
    Object.assign(c,await api('/api/camps/'+c.id,{method:'PATCH',body:J({available_beds:v})}));renderCamp()};
  $('#bm').onclick=()=>setBeds(-1);$('#bp').onclick=()=>setBeds(1);
  box.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{
    const f=b.dataset.f,list=c.facilities.includes(f)?c.facilities.filter(x=>x!==f):[...c.facilities,f];
    Object.assign(c,await api('/api/camps/'+c.id,{method:'PATCH',body:J({facilities:list})}));renderCamp()});
}

async function loadReqs(){
  try{(await api('/api/requests?limit=500')).forEach(r=>reqs.set(r.id,r))}catch{return}
  renderNear();
}

function renderNear(){
  const c=camps.find(x=>String(x.id)===cur);
  if(!c){$('#near').innerHTML='<p class="muted">Select or add a camp first.</p>';return}
  const rows=[...reqs.values()].filter(r=>r.status!=='done'&&r.latitude!=null)
    .map(r=>({...r,d:km(c.latitude,c.longitude,r.latitude,r.longitude)})).sort((a,b)=>a.d-b.d).slice(0,25);
  $('#near').innerHTML=rows.map(r=>`<div class="card" style="border:1px solid #e3e8ee;box-shadow:none">
    <div class="row"><span class="badge ${r.priority_label}">${r.priority_label}</span><b>${esc(r.type)}</b><span class="muted" style="margin-left:auto">${r.d.toFixed(1)} km · ${ago(r.created_at)}</span></div>
    <div>${esc(r.message)}</div><div class="muted">${r.people_count} people · ${esc(r.status.replace('_',' '))} · ${esc(r.tracking_code)}</div>
    <div class="row" style="margin-top:8px"><button class="green" data-i="${r.id}">Invite to this camp</button><button class="sec" data-d="${r.id}">Mark done</button></div></div>`).join('')||'<p class="muted">No open requests with a location.</p>';
  $('#near').querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{
    await api(`/api/requests/${b.dataset.i}/reply`,{method:'POST',body:J({message:`Please come to ${c.name}${c.contact?' ('+c.contact+')':''} if it is safe. Beds and food are available.`})});loadReqs()});
  $('#near').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{
    await api('/api/requests/'+b.dataset.d,{method:'PATCH',body:J({status:'done'})});loadReqs()});
}

async function loadMissing(){
  try{
    const list=await api('/api/missing?status=missing&q='+encodeURIComponent($('#q').value.trim()));
    $('#mlist').innerHTML=list.map(m=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #e3e8ee">
      <div style="flex:1"><b>${esc(m.name)}</b>${m.age!=null?', '+m.age:''}<div class="muted">${esc(m.last_seen_place||'')} ${m.reporter_phone?'· call '+esc(m.reporter_phone):''}</div></div>
      <button class="green" data-f="${m.id}">Found</button></div>`).join('')||'<p class="muted">No missing persons match.</p>';
    $('#mlist').querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{await api('/api/missing/'+b.dataset.f,{method:'PATCH',body:J({status:'found'})});loadMissing()});
  }catch{}
}
$('#sq').onclick=loadMissing;$('#q').onkeydown=e=>{if(e.key==='Enter')loadMissing()};
$('#madd').onclick=async()=>{
  const n=$('#mn').value.trim();if(!n)return;
  const b={name:n,last_seen_place:$('#mp').value.trim()||undefined};if($('#ma').value!=='')b.age=+$('#ma').value;
  try{await api('/api/missing',{method:'POST',body:J(b)});$('#mn').value=$('#ma').value=$('#mp').value='';loadMissing()}catch(e){alert(e.message)}
};

if(token)start();
</script>
</body></html>
