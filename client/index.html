<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdaptNet – Get Help</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d2a4a">
<link rel="stylesheet" href="style.css">
<style>
body{max-width:560px;margin:0 auto;padding:12px 12px 60px}
h1{font-size:24px;margin:6px 0}h3{margin:18px 0 8px}
#bar{padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:10px}
.on{background:#e8f5e9;color:#1b5e20}.off{background:#fff3e0;color:#e65100}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types button{background:#fff;color:#1b2430;border:3px solid #c5ced8;font-size:18px;padding:18px 8px}
.types button.sel{border-color:#1565c0;background:#e3f2fd}
.chips label{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid #c5ced8;border-radius:99px;padding:8px 12px;margin:0 6px 6px 0}
.chips input{width:auto}
#send{width:100%;font-size:20px;padding:18px;background:#c62828;margin-top:14px}
#toast{position:fixed;left:12px;right:12px;bottom:12px;background:#222;color:#fff;padding:14px;border-radius:12px;text-align:center}
.f{display:grid;gap:8px;margin-top:8px}
</style></head><body>

<h1>AdaptNet – Ask for help</h1>
<div id="bar" class="off">Checking connection…</div>

<h3>What do you need?</h3>
<div class="types" id="types"></div>

<div class="f">
  <label>How many people need help?<input id="ppl" type="number" min="1" max="500" value="1" inputmode="numeric"></label>
  <div class="chips" id="chips"></div>
  <textarea id="msg" rows="3" maxlength="1000" placeholder="Describe what is happening and where you are (landmark, house, road)"></textarea>
  <input id="name" maxlength="100" placeholder="Your name (optional)">
  <input id="phone" maxlength="20" inputmode="tel" placeholder="Phone number (optional)">
  <button class="sec" id="loc">📍 Share my location</button><div id="locs" class="muted"></div>
</div>
<button id="send">SEND HELP REQUEST</button>
<p class="muted">No internet? Your request is saved on this phone and sent automatically when you connect.</p>

<h3>My requests</h3><div id="mine"></div>
<h3>Nearest relief camps</h3><div id="camps"><p class="muted">Loading…</p></div>
<div id="toast" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
const queue=()=>LS('queue')||[],mine=()=>LS('mine')||[];
const TYPES=[['medical','🏥 Medical'],['rescue','🚤 Rescue'],['food','🍞 Food / Water'],['shelter','🏠 Shelter']];
const NEEDS=[['baby','Baby'],['child','Child'],['elderly','Elderly'],['pregnant','Pregnant'],['injured','Injured'],['disabled','Disabled'],['medicines','Medicines'],['formula_milk','Baby milk'],['diapers','Diapers'],['drinking_water','Drinking water']];
const LABEL={waiting:'⏳ Waiting to send',new:'Received by relief team',seen:'👀 Seen by relief team',on_the_way:'🚑 Help is on the way',done:'✅ Completed'};
let type='medical',pos=null,online=false,busy=false,socket=null;

function makeId(){
  if(crypto.randomUUID)return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,4000)}

$('#types').innerHTML=TYPES.map(t=>`<button data-t="${t[0]}" class="${t[0]===type?'sel':''}">${t[1]}</button>`).join('');
$('#types').onclick=e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.t;document.querySelectorAll('#types button').forEach(x=>x.classList.toggle('sel',x===b))};
$('#chips').innerHTML=NEEDS.map(n=>`<label><input type="checkbox" value="${n[0]}">${n[1]}</label>`).join('');

$('#loc').onclick=()=>{
  if(!navigator.geolocation){$('#locs').textContent='Location not available. Describe where you are in the message.';return}
  $('#locs').textContent='Finding your location…';
  navigator.geolocation.getCurrentPosition(p=>{
    pos={latitude:+p.coords.latitude.toFixed(5),longitude:+p.coords.longitude.toFixed(5)};
    $('#locs').textContent='📍 Location saved';camps();
  },()=>{$('#locs').textContent='Could not get location. Describe where you are in the message.'},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
};

$('#send').onclick=()=>{
  const req={id:makeId(),type,message:$('#msg').value.trim(),people_count:Math.max(1,Math.min(500,+$('#ppl').value||1)),
    special_needs:[...document.querySelectorAll('#chips input:checked')].map(i=>i.value),created_at_device:new Date().toISOString(),...(pos||{})};
  if($('#name').value.trim())req.contact_name=$('#name').value.trim();
  if($('#phone').value.trim())req.contact_phone=$('#phone').value.trim();
  LS('queue',[...queue(),req]);                       // 1. save on the phone first
  LS('mine',[{id:req.id,type,created:req.created_at_device,code:null,status:'waiting',replies:[]},...mine()]);
  $('#msg').value='';toast('Saved on this phone. Sending…');
  render();flush();                                   // 2. then try to send
};

async function flush(){
  const q=queue();if(!q.length||busy)return;busy=true;
  try{
    const r=await fetch('/api/requests/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requests:q})});
    if(!r.ok)throw 0;
    const d=await r.json(),ok=new Map(d.results.filter(x=>x.ok).map(x=>[x.id,x])),bad=new Set(d.results.filter(x=>!x.ok).map(x=>x.id));
    LS('queue',q.filter(x=>!ok.has(x.id)&&!bad.has(x.id)));
    const m=mine();m.forEach(e=>{const s=ok.get(e.id);if(s){e.code=s.tracking_code;e.status=s.status;if(socket&&socket.connected)socket.emit('track',e.code)}});LS('mine',m);
    online=true;if(ok.size)toast('Sent! Help request received.');
  }catch{online=false}
  busy=false;render();
}

async function track(){
  const m=mine();let changed=false,news=false;
  for(const e of m){
    if(!e.code||e.status==='done')continue;
    try{
      const r=await fetch('/api/requests/track/'+e.code);if(!r.ok)continue;const d=await r.json();
      if(d.replies.length>e.replies.length)news=true;
      e.status=d.status;e.replies=d.replies;changed=true;
    }catch{return}
  }
  if(changed){LS('mine',m);render()}
  if(news){toast('New message from the relief team');if(navigator.vibrate)navigator.vibrate(300)}
}

async function camps(){
  let list,cached=false;
  try{const r=await fetch('/api/camps'+(pos?`?lat=${pos.latitude}&lng=${pos.longitude}`:''));if(!r.ok)throw 0;list=await r.json();LS('camps',list)}
  catch{list=LS('camps');cached=true}
  $('#camps').innerHTML=list&&list.length?(cached?'<p class="muted">Offline: showing the last saved list</p>':'')+list.map(c=>`<div class="card" style="margin-top:8px"><b>${esc(c.name)}</b>${c.distance_km!=null?' · '+c.distance_km+' km':''}<div class="muted">${c.available_beds} beds free · ${esc(c.facilities.join(', '))}</div>${c.contact?`<div>${esc(c.contact)}</div>`:''}</div>`).join(''):'<p class="muted">No camp list saved yet. Open this page once while connected.</p>';
}

function render(){
  const n=queue().length;
  $('#bar').className=online?'on':'off';
  $('#bar').textContent=(online?'Connected to relief server':'No connection. Requests are saved on this phone and will send automatically')+(n?` · ${n} waiting to send`:'');
  $('#mine').innerHTML=mine().map(e=>`<div class="card" style="margin-top:8px"><b>${esc(e.type)}</b> · ${e.code?esc(e.code):'not sent yet'}
    <div class="muted">${esc(LABEL[e.status]||e.status)}</div>
    ${e.replies.map(x=>`<div class="reply">${esc(x.message)}</div>`).join('')}</div>`).join('')||'<p class="muted">Nothing sent yet.</p>';
}

async function ping(){try{const r=await fetch('/api/health',{cache:'no-store'});online=r.ok}catch{online=false}render()}

if(typeof io==='function'){
  socket=io();
  socket.on('connect',()=>mine().forEach(e=>e.code&&socket.emit('track',e.code)));
  socket.on('reply',track);socket.on('status',track);
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();ping().then(()=>{flush();track()});camps();
setInterval(()=>{ping().then(()=>{flush();track()})},10000);
addEventListener('online',()=>{ping().then(flush)});
</script>
</body></html>
